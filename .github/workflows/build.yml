name: Build installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          modules: 'qtpdf'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\InkPDF.exe dist\
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler dist\InkPDF.exe
          foreach ($d in 'imageformats','iconengines','tls','networkinformation','generic') { Remove-Item "dist\$d" -Recurse -Force -ErrorAction SilentlyContinue }
      - name: Make installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: InkPDF-Setup
          path: Output/InkPDF-Setup.exe
